name: Upload high-resolution About assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-about-hires-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and export full-resolution images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          mkdir -p /tmp/about-hires

          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/S7C1luX7VoWCLYLx' -o /tmp/about-hires/olive-wide
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/AbLo3k9viQjqBI3O' -o /tmp/about-hires/laundry-bag-bed
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/nnuu9Gzb1b4qq1Z7' -o /tmp/about-hires/olive-negative-space
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/h4ldX5HVBdJsNhXs' -o /tmp/about-hires/towels-wicker-basket
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/MX0MojbnNXtIaHTc' -o /tmp/about-hires/basket-vase-wide
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/r8ccnvSh6RxLp3Ws' -o /tmp/about-hires/towels-pitcher
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/QXvjToVGNhZPSi48' -o /tmp/about-hires/towels-stack-vase

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          pairs = {
              'olive-wide': 'assets/img/about-olive-branches-wide-hires.webp',
              'laundry-bag-bed': 'assets/img/about-laundry-bag-bed-hires.webp',
              'olive-negative-space': 'assets/img/about-olive-branches-negative-space-hires.webp',
              'towels-wicker-basket': 'assets/img/about-towels-wicker-basket-hires.webp',
              'basket-vase-wide': 'assets/img/about-basket-vase-wide-hires.webp',
              'towels-pitcher': 'assets/img/about-towels-pitcher-hires.webp',
              'towels-stack-vase': 'assets/img/about-towels-stack-vase-hires.webp',
          }

          for source_name, output_name in pairs.items():
              source = Path('/tmp/about-hires') / source_name
              output = Path(output_name)
              output.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(source) as im:
                  im.load()
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGB')
                  width, height = im.size
                  if width < 1200 or height < 900:
                      raise SystemExit(f'{source_name}: unexpected low resolution {width}x{height}')
                  im.save(output, 'WEBP', quality=94, method=6)
              size = output.stat().st_size
              if size < 50000:
                  raise SystemExit(f'{output_name}: output suspiciously small ({size} bytes)')
              print(f'{output_name}: {width}x{height}, {size} bytes')
          PY

      - name: Commit high-resolution assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/upload-about-hires-assets.yml
          git add assets/img/about-*-hires.webp .github/workflows/upload-about-hires-assets.yml
          git commit -m 'Replace About images with full-resolution assets'
          git push origin main
