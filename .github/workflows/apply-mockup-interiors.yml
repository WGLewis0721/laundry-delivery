name: Apply mockup-matched Soapbox interiors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mockup-interiors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch one-shot updater
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_mockup_decor.py')
          s = p.read_text(encoding='utf-8')
          needle = "t = remove_picture_with(t, 'assets/img/decor-towels-pitcher.webp', count=1)"
          first = s.find(needle)
          second = s.find(needle, first + 1)
          if first < 0 or second < 0:
              raise SystemExit('expected two towels-pitcher removal calls')
          replacement = '''step3_pattern = re.compile(r'<picture class="brand-media brand-media--wide interior-photo">\\s*<img src="assets/img/decor-towels-pitcher\\.webp".*?</picture>', re.S)\nt, n = step3_pattern.subn('', t, count=1)\nif n != 1:\n    raise SystemExit('how-it-works step 3 image not found')'''
          s = s[:second] + replacement + s[second + len(needle):]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply mockup-matched interior design
        run: python3 scripts/apply_mockup_decor.py

      - name: Commit and push site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/interior-decor.css schedule.html plans.html about.html how-it-works.html faq.html services.html service-area.html
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Match interior pages to Soapbox decorative mockup"
          git push origin main
