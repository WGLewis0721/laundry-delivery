name: Refine interior imagery

on:
  push:
    paths:
      - '.github/workflows/refine-interior-images.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace low-resolution interior assets and refine styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          pages = [p for p in root.glob('*.html') if p.name != 'index.html']

          replacements = {
              'assets/img/decor-towels-pitcher.webp': 'assets/img/folded-towels-tall-olive-vase.jpg',
              'assets/img/decor-towels-olive-vase.webp': 'assets/img/folded-towels-olive-vase.jpg',
              'assets/img/decor-wide-basket-vase.webp': 'assets/img/laundry-basket-towels-hero.jpg',
              'assets/img/decor-towels-basket.webp': 'assets/img/CA90A6C8-A01E-4A4C-B87B-A50CB24353D5.png',
              'assets/img/decor-olive-branches.webp': 'assets/img/olive-branch-wide.jpg',
          }

          for path in pages:
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          css_path = Path('css/interior-decor.css')
          css = css_path.read_text()
          css = css.replace('../assets/img/decor-olive-branches.webp', '../assets/img/olive-branch-wide.jpg')

          marker = '/* === HIGH-RES MOCKUP REFINEMENT 2026-08-25 === */'
          if marker not in css:
              css += r'''

/* === HIGH-RES MOCKUP REFINEMENT 2026-08-25 === */

/* Use full-resolution photography at natural scale. */
.mockup-photo img,
.interior-photo img,
.interior-page-banner img,
.schedule-support-photo img,
.pricing-side-basket img,
.about-hero-photo img,
.about-lower-scene img {
  image-rendering: auto;
  transform: none;
}

/* Booking page: keep the product cards clean and make the featured badge fully visible. */
body[data-page="schedule"] .schedule-bag-grid {
  overflow: visible;
  padding-top: 1.15rem;
}
body[data-page="schedule"] .schedule-bag-card {
  position: relative;
  overflow: visible !important;
}
body[data-page="schedule"] .schedule-bag-card.plan-card--featured {
  padding-top: 1.35rem;
  margin-top: 0;
}
body[data-page="schedule"] .schedule-bag-card .plan-badge {
  position: absolute;
  top: -0.78rem;
  left: 50%;
  right: auto;
  transform: translateX(-50%);
  z-index: 8;
  width: max-content;
  max-width: calc(100% - 2rem);
  padding: .42rem 1.15rem;
  border-radius: 999px;
  line-height: 1.15;
  white-space: nowrap;
  overflow: visible;
  clip: auto;
}
body[data-page="schedule"] .schedule-bag-media {
  position: relative;
  z-index: 1;
  overflow: hidden;
  border-radius: 1.35rem;
  background: linear-gradient(180deg, rgba(247,242,240,.75), rgba(247,242,240,.35));
}
body[data-page="schedule"] .schedule-bag-media img {
  object-fit: contain;
  max-width: 78%;
  max-height: 88%;
  margin: auto;
}
body[data-page="schedule"] .schedule-subscription-row {
  align-items: center;
  gap: clamp(1.25rem, 4vw, 3rem);
}
body[data-page="schedule"] .schedule-support-photo {
  width: min(28rem, 42%);
  aspect-ratio: 1 / 1;
  border: 0;
  box-shadow: none;
  background: transparent;
}
body[data-page="schedule"] .schedule-support-photo::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: linear-gradient(90deg, var(--decor-cream) 0%, rgba(247,242,240,.72) 10%, transparent 38%);
}
body[data-page="schedule"] .schedule-support-photo img {
  object-fit: cover;
  object-position: center;
}

/* Mockup-like botanical corner accents using the new high-res source. */
body[data-page="schedule"] #booking-main::before,
.pricing-bags-section::before,
.pricing-bags-section::after,
.about-hero-section::after,
body[data-page="faq"] main::before,
body[data-page="services"] main::before,
body[data-page="service-area"] main::before {
  background-image: url("../assets/img/olive-branch-wide.jpg");
  background-size: cover;
  background-position: center;
  filter: saturate(.9) contrast(.96);
}

/* Pricing page: product cards remain primary; basket photo supports them on the right. */
body[data-page="plans"] .pricing-side-basket {
  border: 0;
  box-shadow: none;
  background: transparent;
  min-height: 25rem;
}
body[data-page="plans"] .pricing-side-basket img {
  object-fit: cover;
  object-position: center;
  border-radius: 1.5rem;
  box-shadow: var(--decor-shadow-soft);
}

/* About: high-resolution editorial hero with a soft fade into the copy. */
body[data-page="about"] .about-hero-photo {
  min-height: clamp(30rem, 46vw, 42rem);
  border: 0;
  box-shadow: none;
  background: var(--decor-cream);
}
body[data-page="about"] .about-hero-photo img {
  object-fit: cover;
  object-position: center;
}
body[data-page="about"] .about-hero-photo::after {
  background: linear-gradient(90deg,
    var(--decor-cream) 0%,
    rgba(247,242,240,.90) 8%,
    rgba(247,242,240,.34) 24%,
    transparent 48%);
}
body[data-page="about"] .about-lower-scene {
  width: min(680px, 64%);
  border-radius: 1.5rem;
  overflow: hidden;
}
body[data-page="about"] .about-lower-scene img {
  aspect-ratio: 16 / 9;
  object-fit: cover;
  object-position: center right;
}

/* How it works: soft supporting imagery, never overpower the step content. */
body[data-page="how-it-works"] .hiw-feature-photo,
body[data-page="how-it-works"] .hiw-trust-accent {
  border: 0;
  box-shadow: var(--decor-shadow-soft);
}

/* FAQ, services, service area and utility pages: restrained editorial decoration. */
body[data-page="faq"] .faq-support-photo,
body[data-page="services"] .services-support-photo,
body[data-page="service-area"] .service-area-support-photo,
.interior-page-banner {
  border-color: rgba(207,197,184,.52);
  box-shadow: 0 10px 28px rgba(14,14,16,.055);
}

/* Give remaining interior pages a subtle photographic botanical edge without touching index.html. */
body:not([data-page="schedule"]):not([data-page="plans"]):not([data-page="about"]):not([data-page="how-it-works"]):not([data-page="faq"]):not([data-page="services"]):not([data-page="service-area"]) main {
  position: relative;
  isolation: isolate;
  overflow: hidden;
}
body:not([data-page="schedule"]):not([data-page="plans"]):not([data-page="about"]):not([data-page="how-it-works"]):not([data-page="faq"]):not([data-page="services"]):not([data-page="service-area"]) main::after {
  content: "";
  position: absolute;
  z-index: -1;
  right: -8rem;
  top: 2.5rem;
  width: 24rem;
  height: 29rem;
  pointer-events: none;
  background: url("../assets/img/olive-branch-right.jpg") center / cover no-repeat;
  opacity: .075;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 38%, transparent 76%);
  mask-image: radial-gradient(ellipse at center, #000 38%, transparent 76%);
}

@media (max-width: 800px) {
  body[data-page="schedule"] .schedule-subscription-row {
    grid-template-columns: 1fr;
  }
  body[data-page="schedule"] .schedule-support-photo {
    width: min(100%, 26rem);
    margin-inline: auto;
  }
  body[data-page="about"] .about-hero-photo {
    min-height: 24rem;
    aspect-ratio: 4 / 3;
  }
  body[data-page="about"] .about-lower-scene {
    width: 100%;
  }
}

@media (max-width: 540px) {
  body[data-page="schedule"] .schedule-bag-grid {
    padding-top: 1.5rem;
  }
  body[data-page="schedule"] .schedule-bag-card.plan-card--featured {
    margin-top: .5rem;
  }
  body[data-page="schedule"] .schedule-bag-card .plan-badge {
    top: -1rem;
    font-size: .78rem;
    letter-spacing: .02em;
  }
  body[data-page="schedule"] .schedule-bag-media img {
    max-width: 72%;
  }
}
'''
          css_path.write_text(css)
          PY

      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/refine-interior-images.yml
          git add about.html schedule.html plans.html how-it-works.html faq.html services.html service-area.html account.html login.html confirmation.html estimate.html status.html terms.html privacy.html css/interior-decor.css .github/workflows/refine-interior-images.yml
          git commit -m "Refine interior imagery with high-resolution assets"
          git push origin main
