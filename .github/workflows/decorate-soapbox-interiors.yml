name: Decorate Soapbox interior pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decorate-soapbox-interiors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decorate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply generated imagery to interior pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          ROOT = Path('.')
          INDEX = ROOT / 'index.html'
          before_index = hashlib.sha256(INDEX.read_bytes()).hexdigest()

          pages = [
              'about.html', 'account.html', 'confirmation.html', 'estimate.html',
              'faq.html', 'how-it-works.html', 'login.html', 'plans.html',
              'privacy.html', 'schedule.html', 'service-area.html', 'services.html',
              'status.html', 'terms.html'
          ]

          for p in pages:
              if not Path(p).exists():
                  raise SystemExit(f'Missing expected interior page: {p}')

          css = r'''/* =========================================================
             SOAPBOX CADDIE — INTERIOR PAGE DECORATION
             index.html intentionally does NOT load this stylesheet.
             ========================================================= */

          .decorative-strip,
          .editorial-photo,
          .booking-decor-banner,
          .utility-page-art,
          .legal-page-art,
          .confirmation-art,
          .service-photo {
            overflow: hidden;
            background: var(--off-white);
            border: 1px solid var(--border);
            border-radius: var(--radius-2xl);
          }

          .decorative-strip img,
          .editorial-photo img,
          .booking-decor-banner img,
          .booking-step-art img,
          .utility-page-art img,
          .legal-page-art img,
          .confirmation-art img,
          .service-photo img,
          .gift-editorial__media img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
          }

          .decorative-strip {
            width: 100%;
            margin: 0 auto var(--space-10);
          }
          .decorative-strip--wide { aspect-ratio: 16 / 6; }
          .decorative-strip--medium { aspect-ratio: 16 / 7; }
          .decorative-strip--right img { object-position: center right; }

          .editorial-photo--landscape { aspect-ratio: 16 / 10; }

          .booking-decor-banner {
            margin-bottom: var(--space-8);
            aspect-ratio: 16 / 5;
          }
          .booking-decor-banner img { object-position: center right; }

          .booking-step-art {
            display: block;
            width: clamp(110px, 16vw, 190px);
            aspect-ratio: 1 / 1;
            border-radius: var(--radius-xl);
            overflow: hidden;
            flex-shrink: 0;
          }

          .plan-card--text-only { padding-top: var(--space-8); }
          .plan-card--text-only .plan-name { margin-top: 0; }
          .plan-card--text-only::before {
            content: "";
            display: block;
            width: 2.5rem;
            height: 2px;
            margin-bottom: var(--space-5);
            background: var(--brand-olive);
            border-radius: var(--radius-full);
          }

          .gift-editorial {
            display: grid;
            grid-template-columns: minmax(0, .9fr) minmax(320px, 1.1fr);
            gap: var(--space-8);
            align-items: center;
            padding: var(--space-8);
            border: 1px solid var(--border);
            border-radius: var(--radius-2xl);
            background: var(--off-white);
          }
          .gift-editorial__media {
            overflow: hidden;
            border-radius: var(--radius-xl);
            aspect-ratio: 3 / 2;
          }

          .utility-page-art {
            max-width: 900px;
            margin: 0 auto var(--space-8);
            aspect-ratio: 16 / 5;
          }
          .legal-page-art {
            max-width: 720px;
            margin: 0 auto var(--space-8);
            height: clamp(120px, 18vw, 190px);
          }
          .confirmation-art {
            max-width: 900px;
            margin: var(--space-8) auto var(--space-12);
            aspect-ratio: 16 / 6;
          }
          .confirmation-art img { object-position: center right; }

          .service-photo {
            width: 100%;
            margin-bottom: var(--space-5);
            aspect-ratio: 4 / 3;
          }

          body[data-page="faq"] main,
          body[data-page="service-area"] main,
          body[data-page="legal"] main,
          body[data-page="login"] main,
          body[data-page="account"] main,
          body[data-page="status"] main {
            position: relative;
            isolation: isolate;
            overflow: hidden;
          }

          body[data-page="faq"] main::after,
          body[data-page="service-area"] main::after,
          body[data-page="legal"] main::after,
          body[data-page="login"] main::after,
          body[data-page="account"] main::after,
          body[data-page="status"] main::after {
            content: "";
            position: absolute;
            z-index: -1;
            pointer-events: none;
            width: min(28rem, 38vw);
            height: min(34rem, 48vw);
            right: -10rem;
            top: 4rem;
            background:
              linear-gradient(to left, rgba(247,242,240,.05), rgba(247,242,240,.98)),
              url("../assets/img/decor-olive-branches.webp");
            background-size: cover;
            background-position: center;
            opacity: .14;
          }

          @media (max-width: 800px) {
            .decorative-strip--wide,
            .decorative-strip--medium,
            .booking-decor-banner,
            .utility-page-art,
            .confirmation-art { aspect-ratio: 4 / 3; }
            .gift-editorial { grid-template-columns: 1fr; padding: var(--space-5); }
            .booking-step-art { width: 100%; max-width: 220px; aspect-ratio: 16 / 9; }
            body[data-page] main::after { display: none; }
          }

          @media (max-width: 540px) {
            .decorative-strip,
            .editorial-photo,
            .booking-decor-banner,
            .utility-page-art,
            .legal-page-art,
            .confirmation-art { border-radius: var(--radius-xl); }
            .decorative-strip--wide,
            .decorative-strip--medium,
            .utility-page-art,
            .confirmation-art { aspect-ratio: 1 / 1; }
          }
          '''
          Path('css/interior-decor.css').write_text(css, encoding='utf-8')

          def load(name):
              return Path(name).read_text(encoding='utf-8')

          def save(name, text):
              Path(name).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Expected marker missing: {label}')
              return text.replace(old, new, 1)

          def replace_picture(text, asset_needle, replacement, label):
              pattern = re.compile(
                  r'<picture\b[^>]*>(?:(?!</picture>).)*?' + re.escape(asset_needle) +
                  r'(?:(?!</picture>).)*?</picture>', re.S
              )
              text2, n = pattern.subn(replacement, text, count=1)
              if n != 1:
                  raise SystemExit(f'Expected one picture for {label}; found {n}')
              return text2

          def inject_before_dark_cta_or_main(text, html):
              marker = '<section class="section section--dark closing-cta"'
              if marker in text:
                  return text.replace(marker, html + '\n\n  ' + marker, 1)
              return replace_once(text, '</main>', html + '\n\n</main>', 'closing </main>')

          link_marker = '<link rel="stylesheet" href="css/utilities.css">'
          decor_link = '<link rel="stylesheet" href="css/interior-decor.css">'
          for page in pages:
              t = load(page)
              if decor_link not in t:
                  t = replace_once(t, link_marker, link_marker + '\n  ' + decor_link, f'{page} stylesheet link')
              save(page, t)

          # About
          t = load('about.html')
          t = replace_picture(t, 'assets/img/about-soapbox-caddie', '''<figure class="editorial-photo editorial-photo--landscape">
          <img src="assets/img/decor-towels-pitcher.webp" width="720" height="540"
               alt="Folded cream and gray towels beside a white pitcher filled with olive branches."
               loading="eager" decoding="async">
        </figure>''', 'about primary photo')
          about_lower = '''  <div class="wrap">
            <figure class="decorative-strip decorative-strip--wide decorative-strip--right">
              <img src="assets/img/decor-wide-basket-vase.webp" width="720" height="480"
                   alt="Wicker laundry basket filled with cream towels beside folded linens and a ceramic vase."
                   loading="lazy" decoding="async">
            </figure>
          </div>'''
          t = inject_before_dark_cta_or_main(t, about_lower)
          save('about.html', t)

          # Schedule
          t = load('schedule.html')
          banner = '''
            <figure class="booking-decor-banner">
              <img src="assets/img/decor-teddy-basket.webp" width="720" height="405"
                   alt="Light wicker laundry basket filled with cream linens with a teddy bear resting on top."
                   loading="eager" fetchpriority="high" decoding="async">
            </figure>'''
          pat = re.compile(r'(<main id="booking-main"[^>]*>\s*<div class="wrap">)', re.S)
          t, n = pat.subn(r'\1' + banner, t, count=1)
          if n != 1:
              raise SystemExit('Could not place schedule banner')
          t, n = re.subn(
              r'<img class="step2-accent"[^>]*subscription-folded-laundry\.webp[^>]*>',
              '''<figure class="booking-step-art">
              <img src="assets/img/decor-towels-basket.webp" width="620" height="620"
                   alt="Folded cream and beige towels arranged neatly in a light wicker basket."
                   loading="lazy" decoding="async">
            </figure>''', t, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace schedule step-2 accent')
          bag_pattern = re.compile(
              r'\s*<picture class="brand-media brand-media--product">(?:(?!</picture>).)*?assets/img/bag-(?:small|medium|large)(?:(?!</picture>).)*?</picture>\s*',
              re.S)
          t, n = bag_pattern.subn('\n', t)
          if n != 3:
              raise SystemExit(f'Expected to remove 3 schedule bag pictures; removed {n}')
          t = replace_once(t, '<article class="plan-card" aria-label="Small Bag">', '<article class="plan-card plan-card--text-only" aria-label="Small Bag">', 'schedule small card')
          t = replace_once(t, '<article class="plan-card plan-card--featured" aria-label="Medium Bag">', '<article class="plan-card plan-card--featured plan-card--text-only" aria-label="Medium Bag">', 'schedule medium card')
          t = replace_once(t, '<article class="plan-card" aria-label="Large Bag">', '<article class="plan-card plan-card--text-only" aria-label="Large Bag">', 'schedule large card')
          save('schedule.html', t)

          # How it works
          t = load('how-it-works.html')
          t = replace_picture(t, 'assets/img/hero-soapbox-caddie', '''<picture class="brand-media brand-media--wide">
          <img src="assets/img/decor-teddy-basket.webp" width="720" height="405"
               alt="Teddy bear resting on fresh cream linens in a wicker laundry basket."
               loading="lazy" decoding="async">
        </picture>''', 'how-it-works step 1')
          t = replace_picture(t, 'assets/img/gift-laundry-pile', '''<picture class="brand-media brand-media--wide">
          <img src="assets/img/decor-wide-basket-vase.webp" width="720" height="480"
               alt="Wicker laundry basket with soft cream towels beside a vase and folded linens."
               loading="lazy" decoding="async">
        </picture>''', 'how-it-works step 2')
          t = replace_picture(t, 'assets/img/subscription-folded-laundry', '''<picture class="brand-media brand-media--wide">
          <img src="assets/img/decor-towels-pitcher.webp" width="720" height="540"
               alt="Folded premium cream and gray towels beside a white ceramic pitcher with olive branches."
               loading="lazy" decoding="async">
        </picture>''', 'how-it-works step 3')
          save('how-it-works.html', t)

          # Plans
          t = load('plans.html')
          plans_strip = '''  <div class="wrap" style="padding-top: var(--space-8);">
            <figure class="decorative-strip decorative-strip--wide">
              <img src="assets/img/decor-towels-pitcher.webp" width="720" height="540"
                   alt="Premium cream and gray towels arranged beside a white pitcher with olive branches."
                   loading="eager" decoding="async">
            </figure>
          </div>

          '''
          t = replace_once(t, '  <!-- Bag pricing -->', plans_strip + '  <!-- Bag pricing -->', 'plans hero strip')
          bag_pattern_plans = re.compile(
              r'\s*<picture class="brand-media brand-media--product">(?:(?!</picture>).)*?assets/img/bag-(?:small|medium|large)(?:(?!</picture>).)*?</picture>\s*',
              re.S)
          t, n = bag_pattern_plans.subn('\n', t)
          if n != 3:
              raise SystemExit(f'Expected to remove 3 plans bag pictures; removed {n}')
          t = replace_once(t, '<article class="plan-card" id="small"', '<article class="plan-card plan-card--text-only" id="small"', 'plans small card')
          t = replace_once(t, '<article class="plan-card plan-card--featured" id="medium"', '<article class="plan-card plan-card--featured plan-card--text-only" id="medium"', 'plans medium card')
          t = replace_once(t, '<article class="plan-card" id="large"', '<article class="plan-card plan-card--text-only" id="large"', 'plans large card')
          t = replace_picture(t, 'assets/img/subscription-folded-laundry', '''<picture class="brand-media brand-media--wide">
        <img src="assets/img/decor-towels-basket.webp" width="620" height="620"
             alt="A neat stack of premium cream and beige towels inside a light wicker basket."
             loading="lazy" decoding="async">
      </picture>''', 'plans subscription photo')
          gift = '''  <section class="section" aria-labelledby="gift-pricing-heading">
            <div class="wrap">
              <div class="gift-editorial">
                <div>
                  <span class="section-label">Gift Laundry</span>
                  <h2 id="gift-pricing-heading">Give someone their time back.</h2>
                  <p class="section-desc">A thoughtful way to take one thing off somebody else's list.</p>
                  <a href="index.html#gift-laundry" class="btn btn--ghost">Explore Gift Laundry</a>
                </div>
                <figure class="gift-editorial__media">
                  <img src="assets/img/decor-gift-cards-eucalyptus.webp" width="720" height="480"
                       alt="Soapbox Caddie gift cards with the official brand mark arranged beside fresh eucalyptus branches."
                       loading="lazy" decoding="async">
                </figure>
              </div>
            </div>
          </section>'''
          t = inject_before_dark_cta_or_main(t, gift)
          save('plans.html', t)

          # Services
          t = load('services.html')
          t = replace_picture(t, 'assets/img/subscription-folded-laundry', '''<figure class="service-photo">
            <img src="assets/img/decor-towels-basket.webp" width="620" height="620"
                 alt="Folded cream and beige towels arranged in a woven basket."
                 loading="lazy" decoding="async">
          </figure>''', 'services wash/fold')
          t = replace_picture(t, 'assets/img/about-soapbox-caddie', '''<figure class="service-photo">
            <img src="assets/img/decor-wide-basket-vase.webp" width="720" height="480"
                 alt="Fresh cream towels in a wicker basket beside a ceramic vase."
                 loading="lazy" decoding="async">
          </figure>''', 'services hang dry')
          t = replace_picture(t, 'assets/img/business-commercial-linens', '''<figure class="service-photo">
            <img src="assets/img/decor-towels-pitcher.webp" width="720" height="540"
                 alt="Premium folded towels prepared neatly beside fresh olive branches."
                 loading="lazy" decoding="async">
          </figure>''', 'services delicates')
          save('services.html', t)

          # FAQ
          t = load('faq.html')
          t = replace_picture(t, 'assets/img/gift-laundry-pile', '''<figure class="decorative-strip decorative-strip--medium">
        <img src="assets/img/decor-gift-cards-eucalyptus.webp" width="720" height="480"
             alt="Soapbox Caddie gift cards with the official brand mark beside fresh eucalyptus leaves."
             loading="eager" decoding="async">
      </figure>''', 'FAQ banner')
          save('faq.html', t)

          # Service area
          t = load('service-area.html')
          t = replace_picture(t, 'assets/img/about-soapbox-caddie', '''<picture class="brand-media brand-media--wide">
              <img src="assets/img/decor-wide-basket-vase.webp" width="720" height="480"
                   alt="Wicker laundry basket with folded cream towels and a ceramic vase in a bright home setting."
                   loading="lazy" decoding="async">
            </picture>''', 'service area photo')
          save('service-area.html', t)

          # Legal pages
          t = load('terms.html')
          legal_terms = '''
            <div class="wrap" style="padding-top: var(--space-8);">
              <figure class="legal-page-art">
                <img src="assets/img/decor-olive-branches.webp" width="720" height="540"
                     alt="" aria-hidden="true" loading="eager" decoding="async">
              </figure>
            </div>'''
          t = replace_once(t, '<main id="main-content">', '<main id="main-content">' + legal_terms, 'terms art')
          save('terms.html', t)

          t = load('privacy.html')
          legal_privacy = '''
            <div class="wrap" style="padding-top: var(--space-8);">
              <figure class="legal-page-art">
                <img src="assets/img/decor-towels-pitcher.webp" width="720" height="540"
                     alt="" aria-hidden="true" loading="eager" decoding="async">
              </figure>
            </div>'''
          t = replace_once(t, '<main id="main-content">', '<main id="main-content">' + legal_privacy, 'privacy art')
          save('privacy.html', t)

          # Login
          t = load('login.html')
          login_art = '''
            <div class="wrap">
              <figure class="utility-page-art">
                <img src="assets/img/decor-towels-pitcher.webp" width="720" height="540"
                     alt="Freshly folded cream and gray towels beside a white pitcher with olive branches."
                     loading="eager" decoding="async">
              </figure>
            </div>'''
          t, n = re.subn(r'(<main id="main-content"[^>]*>)', r'\1' + login_art, t, count=1)
          if n != 1:
              raise SystemExit('Could not place login art')
          save('login.html', t)

          # Account
          t = load('account.html')
          account_art = '''
            <div class="wrap" style="padding-top: var(--space-8);">
              <figure class="utility-page-art">
                <img src="assets/img/decor-towels-pitcher.webp" width="720" height="540"
                     alt="A tidy stack of premium towels beside a white pitcher holding olive branches."
                     loading="eager" decoding="async">
              </figure>
            </div>'''
          t = replace_once(t, '<main id="main-content">', '<main id="main-content">' + account_art, 'account art')
          save('account.html', t)

          # Confirmation
          t = load('confirmation.html')
          confirmation_art = '''
            <figure class="confirmation-art">
              <img src="assets/img/decor-teddy-basket.webp" width="720" height="405"
                   alt="Teddy bear resting above freshly cleaned cream linens in a light wicker laundry basket."
                   loading="eager" decoding="async">
            </figure>

            '''
          t = replace_once(t, '    <!-- What happens next -->', confirmation_art + '    <!-- What happens next -->', 'confirmation art')
          save('confirmation.html', t)

          # Estimate
          t = load('estimate.html')
          estimate_art = '''
            <div class="wrap" style="margin-top: var(--space-8);">
              <figure class="decorative-strip decorative-strip--medium">
                <img src="assets/img/decor-towels-basket.webp" width="620" height="620"
                     alt="Folded beige and white towels stacked neatly inside a light wicker basket."
                     loading="eager" decoding="async">
              </figure>
            </div>
          '''
          pattern = re.compile(r'(<section class="estimate-hero"[^>]*>.*?)(</section>)', re.S)
          t, n = pattern.subn(r'\1' + estimate_art + r'\2', t, count=1)
          if n != 1:
              raise SystemExit('Could not place estimate hero art')
          save('estimate.html', t)

          # Status
          t = load('status.html')
          status_art = '''
            <figure class="utility-page-art">
              <img src="assets/img/decor-towels-pitcher.webp" width="720" height="540"
                   alt="Fresh folded towels beside a white ceramic pitcher filled with olive branches."
                   loading="eager" decoding="async">
            </figure>
          '''
          t = replace_once(t, '<div class="wrap wrap--narrow">', '<div class="wrap wrap--narrow">' + status_art, 'status art')
          save('status.html', t)

          # Safety assertions.
          after_index = hashlib.sha256(INDEX.read_bytes()).hexdigest()
          if before_index != after_index:
              raise SystemExit('SAFETY FAILURE: index.html changed')

          forbidden = [
              'assets/img/bag-small',
              'assets/img/bag-medium',
              'assets/img/bag-large',
              'soapbox_caddie_drawstring_bag',
              'compact_cream_soapbox_caddie_bag',
              'olive_soapbox_caddie_duffel_bag',
              'soapbox_caddie_cards_with_eucalyptus'
          ]
          for page in pages:
              content = load(page)
              for needle in forbidden:
                  if needle in content:
                      raise SystemExit(f'Forbidden image reference remains in {page}: {needle}')

          expected_new = [
              'decor-teddy-basket.webp', 'decor-towels-basket.webp',
              'decor-gift-cards-eucalyptus.webp', 'decor-olive-branches.webp',
              'decor-towels-pitcher.webp', 'decor-wide-basket-vase.webp'
          ]
          combined = '\n'.join(load(p) for p in pages) + '\n' + css
          for image in expected_new:
              if image not in combined:
                  raise SystemExit(f'Generated asset is not used: {image}')

          print('Interior decoration changes applied successfully.')
          print('index.html SHA256:', after_index)
          PY

      - name: Verify homepage is untouched
        run: git diff --exit-code -- index.html

      - name: Commit and push interior decoration
        shell: bash
        run: |
          rm -f .github/workflows/decorate-soapbox-interiors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Decorate Soapbox Caddie interior pages with generated imagery"
          git push origin HEAD:main
