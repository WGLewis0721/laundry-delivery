name: Apply Soapbox interior decoration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/decorate-soapbox-interiors.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decorate interior pages
        run: python3 scripts/decorate_interiors.py

      - name: Commit completed site changes
        shell: bash
        run: |
          rm -f .github/workflows/decorate-soapbox-interiors.yml
          rm -f scripts/decorate_interiors.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Decorate Soapbox Caddie interior pages with generated imagery"
          git push
