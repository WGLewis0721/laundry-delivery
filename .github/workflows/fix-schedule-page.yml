name: Fix Soapbox schedule page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-schedule-page.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair schedule layout and image rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          schedule = Path('schedule.html')
          css = Path('css/interior-decor.css')
          js = Path('js/booking.js')

          html = schedule.read_text(encoding='utf-8')

          # Use a dedicated, stable grid for the three bag product cards.
          old_grid = '<div class="plans-grid" style="margin-bottom: var(--space-8);">'
          if old_grid not in html:
              raise SystemExit('Bag grid marker not found')
          html = html.replace(old_grid, '<div class="schedule-bag-grid" style="margin-bottom: var(--space-8);">', 1)

          replacements = {
              '<article class="plan-card" aria-label="Small Bag">': '<article class="plan-card schedule-bag-card" aria-label="Small Bag">',
              '<article class="plan-card plan-card--featured" aria-label="Medium Bag">': '<article class="plan-card plan-card--featured schedule-bag-card" aria-label="Medium Bag">',
              '<article class="plan-card" aria-label="Large Bag">': '<article class="plan-card schedule-bag-card" aria-label="Large Bag">',
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'Card marker not found: {old}')
              html = html.replace(old, new, 1)

          # Product images get their own contained media well instead of inheriting generic card media rules.
          if html.count('class="bag-product-visual"') < 3:
              raise SystemExit('Expected three bag image wells')
          html = html.replace('class="bag-product-visual" aria-hidden="true"', 'class="schedule-bag-media"', 3)

          # Replace the hard-to-read wide supporting image with the crisp square towel/basket asset.
          old_support = re.compile(
              r'\s*<figure class="schedule-side-basket mockup-photo"[^>]*>\s*'
              r'<img src="assets/img/decor-wide-basket-vase\.webp"[^>]*>\s*'
              r'</figure>\s*',
              re.S,
          )
          html, n = old_support.subn('\n', html, count=1)
          if n != 1:
              raise SystemExit('Old schedule supporting image not found')

          # Pair the subscription card with one deliberately small, recognizable lifestyle image.
          subscription_open = '<div class="plan-card" aria-label="Subscription" style="max-width: 34rem;">'
          if subscription_open not in html:
              raise SystemExit('Subscription card marker not found')
          html = html.replace(
              subscription_open,
              '<div class="schedule-subscription-row">\n        <div class="plan-card schedule-subscription-card" aria-label="Subscription">',
              1,
          )

          subscription_end = '''          <button class="btn btn--ghost btn--block js-select-plan" data-plan="subscription">
            Choose the Subscription
          </button>
        </div>
      </section>'''
          subscription_new = '''          <button class="btn btn--ghost btn--block js-select-plan" data-plan="subscription">
            Choose the Subscription
          </button>
        </div>

        <figure class="schedule-support-photo mockup-photo">
          <img src="assets/img/decor-towels-basket.webp"
               alt="Folded cream and beige towels arranged neatly in a light wicker basket."
               width="1254" height="1254" loading="lazy" decoding="async">
        </figure>
      </div>
      </section>'''
          if subscription_end not in html:
              raise SystemExit('Subscription closing marker not found')
          html = html.replace(subscription_end, subscription_new, 1)

          schedule.write_text(html, encoding='utf-8')

          # Append schedule-only overrides after the broader decorative system so these rules win cleanly.
          style = css.read_text(encoding='utf-8')
          marker = '/* SCHEDULE PAGE REPAIR — product card alignment and crisp support image */'
          repair_css = r'''

/* SCHEDULE PAGE REPAIR — product card alignment and crisp support image */
body[data-page="schedule"] .schedule-bag-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(.85rem, 2vw, 1.25rem);
  align-items: stretch;
}

body[data-page="schedule"] .schedule-bag-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100%;
  padding: clamp(1rem, 2vw, 1.35rem);
  overflow: hidden !important;
  border: 1px solid color-mix(in srgb, var(--decor-taupe) 70%, transparent);
  border-radius: var(--radius-2xl);
  background: var(--white);
  box-shadow: 0 8px 24px rgba(14,14,16,.045);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}

body[data-page="schedule"] .schedule-bag-card:hover {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--decor-olive) 34%, var(--decor-taupe));
  box-shadow: 0 12px 28px rgba(14,14,16,.065);
}

body[data-page="schedule"] .schedule-bag-card.plan-card--selected {
  border-color: var(--decor-olive);
  box-shadow: 0 0 0 2px rgba(30,37,9,.11), 0 12px 28px rgba(14,14,16,.065);
}

body[data-page="schedule"] .schedule-bag-media {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 10rem;
  margin: 0 0 var(--space-4);
  padding: .7rem;
  overflow: hidden;
  border-radius: var(--radius-xl);
  background: linear-gradient(180deg, #fbf8f6 0%, #f7f2f0 100%);
}

body[data-page="schedule"] .schedule-bag-media img {
  display: block;
  width: auto;
  height: auto;
  max-width: 8rem;
  max-height: 8.6rem;
  object-fit: contain;
  object-position: center;
  image-rendering: auto;
  filter: drop-shadow(0 7px 10px rgba(14,14,16,.07));
}

body[data-page="schedule"] .schedule-bag-card .plan-name,
body[data-page="schedule"] .schedule-bag-card .plan-price {
  text-align: center;
}

body[data-page="schedule"] .schedule-bag-card .plan-features {
  margin-top: var(--space-4);
}

body[data-page="schedule"] .schedule-bag-card .js-select-plan {
  margin-top: auto;
}

body[data-page="schedule"] .schedule-subscription-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(210px, 270px);
  gap: clamp(var(--space-5), 4vw, var(--space-8));
  align-items: stretch;
  margin-top: var(--space-3);
}

body[data-page="schedule"] .schedule-subscription-card {
  max-width: none;
  height: 100%;
}

body[data-page="schedule"] .schedule-support-photo {
  width: 100%;
  max-width: 270px;
  aspect-ratio: 1 / 1;
  align-self: center;
  justify-self: end;
  margin: 0;
  background: var(--decor-cream);
  box-shadow: var(--decor-shadow-soft);
}

body[data-page="schedule"] .schedule-support-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  image-rendering: auto;
}

/* The previous wide/faded schedule image caused the unrecognizable result. */
body[data-page="schedule"] .schedule-side-basket { display: none !important; }

@media (max-width: 900px) {
  body[data-page="schedule"] .schedule-bag-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  body[data-page="schedule"] .schedule-subscription-row {
    grid-template-columns: 1fr;
  }
  body[data-page="schedule"] .schedule-support-photo {
    width: min(320px, 100%);
    max-width: 320px;
    justify-self: center;
  }
}

@media (max-width: 640px) {
  body[data-page="schedule"] #booking-main {
    padding-top: var(--space-6) !important;
  }
  body[data-page="schedule"] .schedule-bag-grid {
    grid-template-columns: 1fr;
    gap: var(--space-4);
  }
  body[data-page="schedule"] .schedule-bag-card {
    padding: var(--space-4);
  }
  body[data-page="schedule"] .schedule-bag-media {
    height: 11rem;
  }
  body[data-page="schedule"] .schedule-bag-media img {
    max-width: 9rem;
    max-height: 9.5rem;
  }
  body[data-page="schedule"] .schedule-support-photo {
    width: min(260px, 86%);
  }
}
'''
          if marker in style:
              style = style[:style.index(marker)].rstrip() + repair_css
          else:
              style = style.rstrip() + repair_css
          css.write_text(style, encoding='utf-8')

          code = js.read_text(encoding='utf-8')
          old_init = '''  const params = new URLSearchParams(window.location.search);
  const urlZip = params.get('zip');
  if (urlZip && /^\\d{5}$/.test(urlZip)) {
    state.zip = urlZip;
    store.set('fold_booking', state);
  }

  goToStep(state.step);'''
          new_init = '''  const params = new URLSearchParams(window.location.search);
  const urlZip = params.get('zip');
  if (urlZip && /^\\d{5}$/.test(urlZip)) {
    state.zip = urlZip;
  }

  // Preserve the bag choice handed off by pricing links such as ?bag=small.
  // Do not skip ZIP qualification; simply keep the choice ready for step 2.
  const requestedPlan = params.get('bag') || params.get('plan');
  const validPlans = new Set(['small', 'medium', 'large', 'subscription']);
  if (requestedPlan && validPlans.has(requestedPlan)) {
    state.plan = requestedPlan;
  }
  store.set('fold_booking', state);

  goToStep(state.step);

  // Restore selected-card styling on refresh and when arriving with ?bag=...
  if (state.plan) {
    const selectedButton = document.querySelector(`.js-select-plan[data-plan="${state.plan}"]`);
    if (selectedButton) {
      selectedButton.closest('.plan-card')?.classList.add('plan-card--selected');
      selectedButton.setAttribute('aria-pressed', 'true');
    }
  }'''
          if old_init not in code:
              raise SystemExit('booking.js URL parameter marker not found')
          code = code.replace(old_init, new_init, 1)

          # Keep aria-pressed accurate when choosing a different card.
          old_select = '''      document.querySelectorAll('.js-select-plan').forEach(b => {
        b.closest('.plan-card').classList.remove('plan-card--selected');
      });
      btn.closest('.plan-card').classList.add('plan-card--selected');'''
          new_select = '''      document.querySelectorAll('.js-select-plan').forEach(b => {
        b.closest('.plan-card').classList.remove('plan-card--selected');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.closest('.plan-card').classList.add('plan-card--selected');
      btn.setAttribute('aria-pressed', 'true');'''
          if old_select not in code:
              raise SystemExit('booking.js selection marker not found')
          code = code.replace(old_select, new_select, 1)
          js.write_text(code, encoding='utf-8')

          # Hard guard: homepage must remain untouched by this workflow.
          PY

      - name: Verify targeted files only
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          echo "$changed" | grep -qx 'schedule.html'
          echo "$changed" | grep -qx 'css/interior-decor.css'
          echo "$changed" | grep -qx 'js/booking.js'
          if echo "$changed" | grep -qx 'index.html'; then
            echo 'index.html changed unexpectedly' >&2
            exit 1
          fi

      - name: Commit and push repair
        shell: bash
        run: |
          rm .github/workflows/fix-schedule-page.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.html css/interior-decor.css js/booking.js .github/workflows/fix-schedule-page.yml
          git commit -m "Fix schedule bag layout and image quality"
          git push origin main
