name: Fix Soapbox schedule page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-schedule-page.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply schedule repair
        run: python3 scripts/fix_schedule_page.py

      - name: Verify homepage untouched
        run: |
          if git diff --name-only | grep -qx 'index.html'; then
            echo 'index.html changed unexpectedly' >&2
            exit 1
          fi
          git diff --name-only

      - name: Commit and push repair
        run: |
          rm .github/workflows/fix-schedule-page.yml
          rm scripts/fix_schedule_page.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.html css/interior-decor.css js/booking.js .github/workflows/fix-schedule-page.yml scripts/fix_schedule_page.py
          git commit -m "Fix schedule bag layout and image quality"
          git push origin main
